<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室 | Real-time Chat</title>
  <link rel="icon" href="favicon.png" />
  <script src="../socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="stylesheet" href="assets/common.css">
  
  <!-- Markdown & Code highlighting libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Styling for markdown content */
    .prose pre {
        background-color: #222 !important;
        padding: 0;
        overflow: hidden;
    }
    .prose pre code {
        display: block;
        padding: 1rem;
        overflow-x: auto;
    }
    .dark .prose {
        color: #e5e7eb;
    }
    .dark .prose strong { color: #fff; }
    .dark .prose a { color: #60a5fa; }
    .dark .prose h1, .dark .prose h2, .dark .prose h3, .dark .prose h4 { color: #fff; }
    .dark .prose code:not(pre code) { 
        background-color: rgba(255,255,255,0.1); 
        padding: 0.2rem 0.4rem; 
        border-radius: 0.25rem;
    }
  </style>
</head>

<body
  class="antialiased bg-lightBg dark:bg-darkBg text-gray-800 dark:text-darkText transition-colors duration-200 flex h-screen overflow-hidden">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-50 dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex-col transition-all duration-300 z-20 absolute md:relative h-full flex transform -translate-x-full md:translate-x-0" id="sidebar">
    <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-white dark:bg-darkBg">
      <h2 class="font-bold text-lg text-primary">選單</h2>
      <button id="closeSidebarBtn" class="md:hidden p-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    
    <div class="p-4 space-y-5 flex-1 overflow-y-auto custom-scrollbar">
      <div class="space-y-2">
        <button id="newChatBtn" class="w-full py-2 pl-3 pr-4 bg-primary hover:bg-primaryDark text-white rounded-lg shadow-sm transition-colors text-sm font-medium flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
          開啟新對話
        </button>
        
        <button id="deleteChatBtn" class="w-full py-2 pl-3 pr-4 bg-red-500 hover:bg-red-600 text-white rounded-lg shadow-sm transition-colors text-sm font-medium flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          刪除當前紀錄
        </button>
      </div>

      <div class="pt-4 border-t border-gray-200 dark:border-gray-800">
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">模型設定</label>
        <select id="modelSelect" class="w-full bg-white dark:bg-darkInput border border-gray-300 dark:border-gray-700 text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5 outline-none transition-colors">
          <option value="">載入中...</option>
        </select>
      </div>

      <div class="pt-4 border-t border-gray-200 dark:border-gray-800 flex-1">
        <div class="flex justify-between items-center mb-3">
          <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">對話紀錄</label>
          <button id="refreshHistoryBtn" class="text-xs text-primary hover:text-primaryDark hover:underline flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            重整
          </button>
        </div>
        <ul id="historyList" class="space-y-1 text-sm overflow-x-hidden">
           <li class="text-gray-400 italic px-2">載入中...</li>
        </ul>
      </div>
    </div>
  </aside>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden transition-opacity"></div>

  <!-- Main Chat Content -->
  <div class="flex-1 flex flex-col h-screen relative min-w-0">
    <!-- Header -->
    <header class="bg-white dark:bg-darkBg shadow-sm border-b border-gray-200 dark:border-gray-800 py-3 px-4 flex-shrink-0 relative z-0">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <button id="toggleSidebarBtn" class="p-2 -ml-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-darkInput rounded-lg md:hidden transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <h1 class="text-xl font-bold text-primary truncate">聊天室</h1>
          <span id="username" class="text-sm bg-gray-100 dark:bg-darkInput px-3 py-1 rounded-full hidden sm:inline-block truncate max-w-[150px]">載入中...</span>
        </div>
        <div>
          <button id="darkModeToggle"
            class="dark-mode-toggle p-2 text-lg rounded-full hover:bg-gray-100 dark:hover:bg-darkInput transition-colors"></button>
        </div>
      </div>
    </header>

  <!-- Chat Messages Area -->
  <main class="flex-1 overflow-y-auto p-4 custom-scrollbar">
    <ul id="messages" class="space-y-3 max-w-4xl mx-auto">
      <li class="text-center text-xs text-gray-500 dark:text-gray-400 py-2">— 開始聊天 —</li>
    </ul>
  </main>

  <!-- Message Input Area -->
  <footer class="bg-white dark:bg-darkBg border-t border-gray-200 dark:border-gray-800 p-4 relative flex-shrink-0">
    <div id="statusAlert" class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-900 text-sm px-4 py-2 rounded-lg shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-2 font-medium z-10 flex items-center gap-2">
      <span id="statusAlertText">提示訊息</span>
    </div>
    <form id="form" class="max-w-4xl mx-auto flex gap-2 items-end">
      <textarea id="input"
        class="flex-1 py-3 px-4 rounded-xl bg-gray-100 dark:bg-darkInput text-base border border-gray-300 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primaryDark resize-none overflow-hidden custom-scrollbar transition-shadow duration-200 leading-relaxed"
        placeholder="輸入訊息... (Ctrl+Enter 換行, Enter 發送)" rows="1" style="min-height: 52px; max-height: 200px;"></textarea>
      <button type="submit"
        class="bg-primary hover:bg-primaryDark text-white font-medium py-3 px-6 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-darkBg flex-shrink-0 h-[52px] shadow-sm flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:mr-1" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
        </svg>
        <span class="hidden sm:inline">送出</span>
      </button>
    </form>
  </footer>
  </div>

  <!-- Scripts -->
  <script src="assets/common.js"></script>
  <script src="chat_core.js"></script>
  <script src="security-warning.js"></script>
</body>

</html>
